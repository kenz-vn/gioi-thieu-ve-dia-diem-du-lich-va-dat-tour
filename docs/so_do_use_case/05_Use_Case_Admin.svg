<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" width="600" height="510">
    <defs>
        <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12" />
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff" />
    <rect x="180" y="25" width="390" height="440" rx="8" ry="8" fill="#fbf7f2" stroke="#8d5b4c" stroke-width="2.2" filter="url(#shadow5)" />
    <text x="375" y="55" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#3b2314">HỆ THỐNG WEBSITE DU LỊCH &amp; ĐẶT TOUR</text>

    <!-- Connectors -->
    <line x1="85" y1="230" x2="260" y2="100" stroke="#777777" stroke-width="1.3" />
    <line x1="85" y1="230" x2="260" y2="160" stroke="#777777" stroke-width="1.3" />
    <line x1="85" y1="230" x2="260" y2="220" stroke="#777777" stroke-width="1.3" />
    <line x1="85" y1="230" x2="260" y2="280" stroke="#777777" stroke-width="1.3" />
    <line x1="85" y1="230" x2="260" y2="340" stroke="#777777" stroke-width="1.3" />
    <line x1="85" y1="230" x2="260" y2="400" stroke="#777777" stroke-width="1.3" />

    <!-- Ellipses -->
    <g class="usecase">
