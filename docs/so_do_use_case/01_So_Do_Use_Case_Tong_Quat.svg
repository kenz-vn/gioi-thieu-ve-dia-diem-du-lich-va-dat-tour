<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 780" width="680" height="780">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#8d5b4c" />
        </marker>
        <marker id="gen" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="8" markerHeight="8" orient="auto">
            <polygon points="0 0, 12 6, 0 12" fill="#ffffff" stroke="#222222" stroke-width="1.5" />
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12" />
        </filter>
    </defs>

    <!-- Canvas -->
    <rect width="100%" height="100%" fill="#ffffff" />

    <!-- SYSTEM BOUNDARY BOX -->
    <rect x="130" y="25" width="420" height="725" rx="8" ry="8" fill="#fbf7f2" stroke="#8d5b4c" stroke-width="2.2" filter="url(#shadow)" />
    <text x="340" y="55" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#3b2314" letter-spacing="0.3">HỆ THỐNG WEBSITE GIỚI THIỆU KHU DU LỊCH VÀ ĐẶT TOUR</text>

    <!-- CONNECTOR LINES -->
    <!-- From Khach Vang Lai (x=65, y=140) -->
    <line x1="65" y1="140" x2="160" y2="105" stroke="#777777" stroke-width="1.2" />
    <line x1="65" y1="140" x2="160" y2="165" stroke="#777777" stroke-width="1.2" />
    <line x1="65" y1="140" x2="160" y2="225" stroke="#777777" stroke-width="1.2" />

