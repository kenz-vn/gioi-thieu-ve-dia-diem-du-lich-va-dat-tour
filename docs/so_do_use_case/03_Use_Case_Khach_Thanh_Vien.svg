    <line x1="85" y1="340" x2="235" y2="475" stroke="#777777" stroke-width="1.3" />

    <!-- Include & Extend -->
    <path d="M 405 235 L 460 235" fill="none" stroke="#8d5b4c" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow3)" />
    <rect x="408" y="218" width="52" height="15" fill="#fbf7f2" rx="2" />
    <text x="434" y="229" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8d5b4c" font-style="italic">«include»</text>

    <path d="M 465 345 L 405 375" fill="none" stroke="#8d5b4c" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow3)" />
    <rect x="420" y="348" width="48" height="15" fill="#fbf7f2" rx="2" />
    <text x="444" y="359" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8d5b4c" font-style="italic">«extend»</text>

    <path d="M 465 435 L 405 400" fill="none" stroke="#8d5b4c" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow3)" />
    <rect x="420" y="415" width="48" height="15" fill="#fbf7f2" rx="2" />
    <text x="444" y="426" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8d5b4c" font-style="italic">«extend»</text>

