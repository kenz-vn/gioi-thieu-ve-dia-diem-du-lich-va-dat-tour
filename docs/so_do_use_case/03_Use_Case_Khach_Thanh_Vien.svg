    <text x="320" y="395" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2b1810">&amp; lịch sử đặt tour</text>

    <ellipse cx="530" cy="335" rx="68" ry="22" fill="#faebd7" stroke="#8d5b4c" stroke-width="1.8" />
    <text x="530" y="339" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2b1810">Hủy đơn đặt tour</text>

    <ellipse cx="530" cy="445" rx="68" ry="22" fill="#faebd7" stroke="#8d5b4c" stroke-width="1.8" />
    <text x="530" y="449" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2b1810">Đánh giá tour đã đi</text>

    <ellipse cx="320" cy="475" rx="90" ry="22" fill="#faebd7" stroke="#8d5b4c" stroke-width="1.8" />
    <text x="320" y="479" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#2b1810">Cập nhật hồ sơ cá nhân</text>

    <!-- Actors -->
    <g class="actor">
        <circle cx="85" cy="90" r="13" fill="#ffffff" stroke="#222222" stroke-width="2.3" />
        <line x1="85" y1="103" x2="85" y2="145" stroke="#222222" stroke-width="2.3" />
        <line x1="63" y1="118" x2="107" y2="118" stroke="#222222" stroke-width="2.3" />
        <line x1="85" y1="145" x2="67" y2="175" stroke="#222222" stroke-width="2.3" />
        <line x1="85" y1="145" x2="103" y2="175" stroke="#222222" stroke-width="2.3" />
        <text x="85" y="196" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#111827">Khách vãng lai</text>
    </g>

    <g class="actor">
        <circle cx="85" cy="310" r="13" fill="#ffffff" stroke="#222222" stroke-width="2.3" />
        <line x1="85" y1="323" x2="85" y2="365" stroke="#222222" stroke-width="2.3" />
        <line x1="63" y1="338" x2="107" y2="338" stroke="#222222" stroke-width="2.3" />
        <line x1="85" y1="365" x2="67" y2="395" stroke="#222222" stroke-width="2.3" />
        <line x1="85" y1="365" x2="103" y2="395" stroke="#222222" stroke-width="2.3" />
        <text x="85" y="416" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#111827">Khách hàng</text>
        <text x="85" y="432" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4b5563">(Thành viên)</text>
    </g>

    <text x="320" y="540" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-style="italic" fill="#444444">Hình 3.3: Use Case của Khách hàng (Thành viên – kế thừa từ Khách vãng lai)</text>
</svg>