<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
    <defs>
        <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#8d5b4c" />
        </marker>
        <marker id="gen3" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="8" markerHeight="8" orient="auto">
            <polygon points="0 0, 12 6, 0 12" fill="#ffffff" stroke="#222222" stroke-width="1.5" />
        </marker>
        <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12" />
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff" />
    <rect x="175" y="25" width="445" height="490" rx="8" ry="8" fill="#fbf7f2" stroke="#8d5b4c" stroke-width="2.2" filter="url(#shadow3)" />
