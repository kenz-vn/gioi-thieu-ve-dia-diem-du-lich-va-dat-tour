    <!-- Generalization Arrow -->
    <line x1="85" y1="280" x2="85" y2="185" stroke="#222222" stroke-width="1.6" marker-end="url(#gen3)" />
    <rect x="94" y="222" width="45" height="18" fill="#ffffff" rx="2" />
    <text x="96" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#444444" font-style="italic">kế thừa</text>

