name: CI/CD Pipeline - Website Du Lich & Dat Tour

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # GIAI ĐOẠN 1: CONTINUOUS INTEGRATION (CI)
  # Kiểm tra mã nguồn, restore dependencies, build ứng dụng
  # ==========================================
  ci-build:
    name: CI - Build & Verify Source Code
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: 2. Cài đặt .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: 3. Khôi phục các thư viện NuGet (dotnet restore)
        run: dotnet restore TravelWeb/TravelWeb.csproj

      - name: 4. Biên dịch mã nguồn dự án (dotnet build)
        run: dotnet build TravelWeb/TravelWeb.csproj --configuration Release --no-restore

      - name: 5. Xuất bản phiên bản Release (dotnet publish)
        run: dotnet publish TravelWeb/TravelWeb.csproj -c Release -o ./publish-output

      - name: 6. Đóng gói Artifact tải về (Release Package)
        uses: actions/upload-artifact@v4
        with:
          name: TravelWeb-Release-Artifact
          path: ./publish-output
          retention-days: 7

  # ==========================================
  # GIAI ĐOẠN 2: CONTINUOUS DELIVERY (CD)
  # Kiểm tra đóng gói Docker Container & Docker Compose
  # ==========================================
  cd-docker:
    name: CD - Docker Container Packaging
    runs-on: ubuntu-latest
    needs: ci-build

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Khởi tạo Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Kiểm tra tính hợp lệ của docker-compose.yml
        run: docker compose config

      - name: 4. Tự động Build Docker Image cho Website
        run: docker compose build travelweb

      - name: 5. Thông báo hoàn tất quy trình CI/CD
        run: echo "🎉 Quy trình CI/CD đã chạy thành công! Toàn bộ mã nguồn và Docker container đã được xác thực an toàn."
